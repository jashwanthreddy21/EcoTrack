# Example Kubernetes Secret Template
# Command to create securely in production:
# kubectl create secret generic ecotrack-secrets -n ecotrack \
#   --from-literal=POSTGRES_USER=ecotrack_admin \
#   --from-literal=POSTGRES_PASSWORD='YOUR_STRONG_PASSWORD' \
#   --from-literal=JWT_SECRET='YOUR_JWT_HMAC_SECRET' \
#   --from-literal=DATABASE_URL='postgresql://ecotrack_admin:YOUR_PASSWORD@postgres-service:5432/ecotrack_db'

apiVersion: v1
kind: Secret
metadata:
  name: ecotrack-secrets
  namespace: ecotrack
type: Opaque
stringData:
  POSTGRES_USER: "ecotrack_admin"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
  DATABASE_URL: "postgresql://ecotrack_admin:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/ecotrack_db"
