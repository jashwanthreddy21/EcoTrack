version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecotrack-postgres
    restart: always
    environment:
      POSTGRES_DB: ecotrack_db
      POSTGRES_USER: ecotrack_admin
      POSTGRES_PASSWORD: ecotrack_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrack_admin -d ecotrack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecotrack-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://ecotrack_admin:ecotrack_secure_pass_2026@postgres:5432/ecotrack_db
      JWT_SECRET: ecotrack_jwt_secret_devops_2026_key
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
