name: EcoTrack CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test, Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Core Logic Unit Tests
        run: npx --yes tsx --test src/utils/ecoLogic.test.ts

      - name: Validate TypeScript Compilation
        run: npm run lint

      - name: Build Production Frontend Assets
        run: npm run build

      - name: Verify Docker Container Build
        run: |
          docker build -f backend/Dockerfile -t ecotrack-backend:ci .
          docker build -f frontend/Dockerfile -t ecotrack-frontend:ci .
